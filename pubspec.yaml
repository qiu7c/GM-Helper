name: gdgm_schedule
description: 广工贸课表 - 查看教务系统课表的 Flutter App (Android/iOS)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 内嵌 WebView 完成 SSO 登录并抓取会话 Cookie
  flutter_inappwebview: ^6.1.5
  # 带 Cookie 请求课表接口
  dio: ^5.7.0
  # 解析教务系统返回的 HTML 表格
  html: ^0.15.4
  # 本地持久化 Cookie / 选项
  shared_preferences: ^2.3.2
  intl: ^0.19.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
