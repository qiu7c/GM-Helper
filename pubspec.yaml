name: gdgm_schedule
description: GMPluse - 广东工贸职业技术学院校园助手 (Android/iOS)
publish_to: 'none'
version: 2.0.4+10

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 内嵌 WebView 完成 SSO 登录并抓取会话 Cookie
  flutter_inappwebview: ^6.1.5
  # 带 Cookie 请求课表接口
  dio: ^5.7.0
  # 解析教务系统返回的 HTML 表格
  html: ^0.15.4
  # 本地持久化 Cookie / 选项
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  # 纯 HTTP 模拟 CAS 登录：AES 加密密码 + Cookie 跟跳
  encrypt: ^5.0.3
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

dev_dependencies:
  flutter_lints: ^4.0.0
  # 生成各平台 App 图标
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_logo.png

# App 图标配置：蓝底白校徽，深浅模式统一不变黑
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  # Android 自适应图标：蓝底 + 白校徽前景（安全区内）
  adaptive_icon_background: "#1083AE"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
