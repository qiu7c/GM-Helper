name: gdgm_schedule
description: GMPluse - 广东工贸职业技术学院校园助手 (Android/iOS)
publish_to: 'none'
version: 2.2.5+17

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 内嵌 WebView 完成 SSO 登录并抓取会话 Cookie
  flutter_inappwebview: ^6.1.5
  # 带 Cookie 请求课表接口
  dio: ^5.7.0
  # 解析教务系统返回的 HTML 表格
  html: ^0.15.4
  # 本地持久化 Cookie / 选项
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  # 纯 HTTP 模拟 CAS 登录：AES 加密密码 + Cookie 跟跳
  encrypt: ^5.0.3
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  # 读 App 自身的版本号：关于页和更新检查都用它，省得跟 pubspec 两处手工同步
  package_info_plus: ^8.0.0
  # 把下载链接丢给系统浏览器（APK/IPA 不在 App 里下）
  url_launcher: ^6.3.0
  # 课表导出成图片后调系统分享。
  # 锁 10.x：11.x 把静态的 Share.shareXFiles 换成了 SharePlus.instance.share(...)，
  # 是破坏性改动，等以后有空再迁。
  share_plus: ^10.0.0
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  # 发现新版本时发一条系统通知（启动自动检测那套）。
  # 锁 17.x：18/19 要求 compileSdk 35，而本项目跟着 Flutter 3.24.5 是 34。
  # 另外它要求 core library desugaring，见 android/app/build.gradle。
  flutter_local_notifications: ^17.2.4

dev_dependencies:
  # 单元测试。项目此前零测试，test/ 下的用例依赖它；不声明的话
  # `flutter test` 连 package:flutter_test 都 import 不到。
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # 生成各平台 App 图标
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_logo.png
    # 更新日志打进包里，「关于 → 更新日志」直接读它
    - CHANGELOG.md

# App 图标配置：蓝底白校徽，深浅模式统一不变黑
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  # Android 自适应图标：蓝底 + 白校徽前景（安全区内）
  adaptive_icon_background: "#1083AE"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
