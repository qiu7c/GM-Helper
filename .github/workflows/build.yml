name: Build App

# 触发条件：推送到 main/master 分支，或在 Actions 页面手动运行
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ---------- 打包 Android APK ----------
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: 显示 Flutter 版本
        run: flutter --version

      - name: 生成 Android/iOS 原生工程壳
        run: flutter create --platforms=android,ios --project-name gdgm_schedule --org cn.gdgm.schedule .

      - name: 注入联网权限 + 设置应用名 GMPluse
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MANIFEST"
          fi
          sed -i 's#android:label="[^"]*"#android:label="GMPluse"#' "$MANIFEST"
          echo "--- AndroidManifest.xml ---"
          cat "$MANIFEST"

      - name: 获取依赖
        run: flutter pub get

      - name: 生成 App 图标（蓝底白校徽）
        run: dart run flutter_launcher_icons

      - name: 修复 inappwebview 在 AGP8 下的 proguard 报错
        run: |
          # 新版 AGP 不再允许 getDefaultProguardFile('proguard-android.txt')，
          # 把插件里的引用替换为 optimize 版即可。
          for f in $(grep -rl "getDefaultProguardFile('proguard-android.txt')" ~/.pub-cache/hosted/pub.dev/flutter_inappwebview_android-*/android/ 2>/dev/null); do
            echo "patching $f"
            sed -i "s/getDefaultProguardFile('proguard-android.txt')/getDefaultProguardFile('proguard-android-optimize.txt')/g" "$f"
          done

      # 覆盖安装的关键：每次构建都必须用**同一个**密钥签名。
      # 没有这一步的话 flutter create 生成的 gradle 会用调试签名，而
      # runner 每次都是新虚拟机、~/.android/debug.keystore 会当场重新随机生成，
      # 于是每个 APK 签名都不同，Android 判定「包名冲突」拒绝覆盖安装。
      - name: 配置固定签名
        run: |
          KS=.github/keystore/gmpluse.jks
          if [ ! -f "$KS" ]; then
            echo "::warning::没有找到 $KS —— 本次用调试签名，这个包**无法**覆盖安装到已装的 App 上。请先跑一次「一次性生成签名密钥」workflow。"
            exit 0
          fi
          # 用绝对路径，免得纠结 storeFile 是相对 android/ 还是 android/app/
          cat > android/key.properties <<EOF
          storePassword=gmpluse2026
          keyPassword=gmpluse2026
          keyAlias=gmpluse
          storeFile=$GITHUB_WORKSPACE/$KS
          EOF
          python3 - <<'PY'
          import re
          p = 'android/app/build.gradle'
          s = open(p, encoding='utf-8').read()
          assert 'keystoreProperties' not in s, '已经打过补丁了'

          # 1) 读取 android/key.properties。
          #    注意不能塞在文件最前面：Gradle 要求 plugins {} 必须是脚本的
          #    第一条语句（前面只允许 buildscript {}），所以放在 android { 之前。
          m = re.search(r'\nandroid\s*\{', s)
          assert m, '没找到 android { 块'
          s = s[:m.start()] + """
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          """ + s[m.start():]

          # 2) 在 android {} 开头加一个 release 签名配置。
          #    Flutter 的模板里没有 signingConfigs 块，所以直接新建一个；
          #    Groovy DSL 里 signingConfigs {} 调两次是合法的。
          m2 = re.search(r'\nandroid\s*\{\n', s)
          assert m2, '没找到 android { 块'
          s = s[:m2.end()] + """    signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }

          """ + s[m2.end():]

          # 3) release 构建改用 release 签名。
          #    模板里可能是 `signingConfig signingConfigs.debug`，
          #    新版是 `signingConfig = signingConfigs.debug`，两种都认。
          s, n = re.subn(r'signingConfig\s*=?\s*signingConfigs\.debug',
                         'signingConfig = signingConfigs.release', s)
          assert n == 1, 'signingConfigs.debug 找到 %d 处（应为 1 处），模板可能变了' % n

          open(p, 'w', encoding='utf-8').write(s)
          print('已把生成的 gradle 换成 release 签名')
          PY

      - name: 编译 Release APK
        run: flutter build apk --release

      # 打印签名指纹：以后每次构建都是同一个值。哪次变了就说明签名又不对了，
      # 那个包会装不上（也是排查「包名冲突」最快的办法）。
      - name: 打印 APK 签名指纹
        run: |
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk \
            | grep -E '所有者|Owner|SHA256' | head -4

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: gdgm-schedule-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # ---------- 打包 iOS（未签名，仅用于自行侧载/自签）----------
  #
  # 提醒：macOS runner 按 **10 倍**扣分钟数。私有仓 Free 套餐每月 2000 分钟，
  # 折合只有约 200 分钟 macOS 时间，而一次 iOS 构建就要十几分钟 —— 推得勤的话
  # 留意 Settings → Billing → Actions 的用量，额度烧完后当月所有构建都不跑。
  build-ios:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: 生成原生工程壳（含 android，供 flutter_launcher_icons 使用）
        run: flutter create --platforms=android,ios --project-name gdgm_schedule --org cn.gdgm.schedule .

      - name: 设置 iOS 最低版本为 12.0（flutter_inappwebview 要求）
        run: |
          PODFILE=ios/Podfile
          if [ -f "$PODFILE" ]; then
            sed -i '' "s/# platform :ios, '[0-9.]*'/platform :ios, '12.0'/" "$PODFILE" || true
          fi

      - name: 注入 ATS 允许任意网络 + 设置应用名 GMPluse
        run: |
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName GMPluse" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string GMPluse" "$PLIST"
          echo "--- Info.plist ---"
          cat "$PLIST"

      - name: 获取依赖
        run: flutter pub get

      - name: 生成 App 图标（蓝底白校徽）
        run: dart run flutter_launcher_icons

      - name: 编译 iOS（不签名）
        run: flutter build ios --release --no-codesign

      - name: 打包为未签名 IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r app-unsigned.ipa Payload
          rm -rf Payload

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: gdgm-schedule-ipa-unsigned
          path: build/ios/iphoneos/app-unsigned.ipa

  # ---------- 发布到「公开分发仓」（APK + 未签名 IPA）----------
  #
  # 源码仓是私有的，但产物必须能直接下载（手机浏览器下载 APK、TrollStore 侧载
  # IPA），所以 Release 建在**另一个公开仓**里。跨仓写用的是 RELEASE_REPO_TOKEN
  # 这个细粒度 PAT（只授权了那一个仓的 Contents: write），不是本仓的 GITHUB_TOKEN。
  release:
    needs: [ build-android, build-ios ]
    # iOS 那步挂了也要把 Android 的包发出去，所以不能只靠 needs 的默认语义
    if: always() && needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read   # 产物推到别的仓库，走 PAT；本仓只读就够
    env:
      REPO: qiu7c/GMPluse-Release
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取版本号
        id: ver
        run: |
          # pubspec.yaml 的 version 形如 2.1.0+11：+ 前是版本名，+ 后是 versionCode
          RAW=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')
          V=${RAW%%+*}
          B=${RAW#*+}
          if [ "$B" = "$RAW" ]; then B=0; fi   # 没有 +N 时兜底
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=$B" >> "$GITHUB_OUTPUT"
          echo "解析到版本：$V+$B"

      # 从 CHANGELOG.md 抽出本版本那一段，同时生成三份东西：
      #   notes.md   —— 原始文本（人看的）
      #   notes.json —— 同一个字符串的 JSON 字面量，塞进 latest.json 的 notes 字段
      #   body.md    —— 分发仓 Release 的正文
      # 用 python 写 JSON 是为了转义：更新日志是多行文本，手工 echo 拼引号迟早出事。
      - name: 取出本版本的更新日志
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          python3 - "$V" <<'PY'
          import json, pathlib, re, sys

          ver = sys.argv[1]

          # 先把换行统一成 \n。CHANGELOG.md 是在 Windows 上手工维护的，
          # 编辑器一旦写成 CRLF，下面那个 `[ \t]*$` 就会因为行尾多出的 \r 匹配不上，
          # 结果更新日志**静默变空**（只有一条 warning），很难查。
          text = (pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')
                  .replace('\r\n', '\n').replace('\r', '\n'))

          # 取 `## <ver>` 到下一个 `## `（或文件结尾）之间的内容。
          # 结尾用 \Z 而不是 $：$ 会立刻匹配到标题那一行的行尾，导致抓出空串。
          m = re.search(r'^##[ \t]+' + re.escape(ver) + r'[ \t]*$(.*?)(?=^##[ \t]|\Z)',
                        text, re.M | re.S)
          notes = m.group(1).strip() if m else ''
          if not notes:
              print('::warning::CHANGELOG.md 里没有 %s 这一节，Release 说明将是空的' % ver)
              notes = '（本版本没有写更新说明）'

          pathlib.Path('notes.md').write_text(notes, encoding='utf-8')
          pathlib.Path('notes.json').write_text(json.dumps(notes, ensure_ascii=False),
                                                encoding='utf-8')

          body = '\n'.join([
              '### 更新内容',
              '',
              notes,
              '',
              '### 下载',
              '',
              '- **Android**：下载 `GMPluse-v%s.apk` 直接安装' % ver,
              '- **iOS**：下载 `GMPluse-v%s-unsigned.ipa`，用 TrollStore / AltStore / '
              'Sideloadly 侧载自签' % ver,
              '',
              '> iOS 为未签名包，需自行侧载。',
          ])
          pathlib.Path('body.md').write_text(body, encoding='utf-8')
          print(body)
          PY

      - name: 下载 APK 产物
        uses: actions/download-artifact@v4
        with:
          name: gdgm-schedule-apk
          path: dist

      - name: 下载 IPA 产物
        if: needs.build-ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: gdgm-schedule-ipa-unsigned
          path: dist

      - name: 重命名产物 + 生成更新清单
        env:
          V: ${{ steps.ver.outputs.version }}
          B: ${{ steps.ver.outputs.code }}
        run: |
          mv dist/app-release.apk "dist/GMPluse-v$V.apk"
          # IPA 有可能没有（iOS 那步挂了）。这里不用 `[ -f x ] && mv`：set -e 下
          # 测试失败会返回非零，整个步骤会被判失败。
          if [ -f dist/app-unsigned.ipa ]; then
            mv dist/app-unsigned.ipa "dist/GMPluse-v$V-unsigned.ipa"
          fi

          # App 读的就是这个文件（地址固定为 releases/latest/download/latest.json）。
          # notes 直接用上一步生成好的 JSON 字面量，别再手工拼引号。
          BASE="https://github.com/$REPO/releases/download/v$V"
          {
            printf '{\n'
            printf '  "version": "%s",\n' "$V"
            printf '  "versionCode": %s,\n' "$B"
            printf '  "notes": %s,\n' "$(cat notes.json)"
            printf '  "apk": "%s/GMPluse-v%s.apk",\n' "$BASE" "$V"
            if [ -f "dist/GMPluse-v$V-unsigned.ipa" ]; then
              printf '  "ipa": "%s/GMPluse-v%s-unsigned.ipa"\n' "$BASE" "$V"
            else
              printf '  "ipa": ""\n'
            fi
            printf '}\n'
          } > dist/latest.json
          echo "--- latest.json ---"
          cat dist/latest.json
          ls -al dist

      # 分发仓刚建好、一个 commit 都没有时，GitHub 拒绝在上面建 release，
      # 回的是 422 "Repository is empty." —— 报错信息里既没有 "empty repo" 的
      # 提示也看不出该干嘛，所以这里先补一个 README 把默认分支顶出来。
      - name: 确认分发仓不是空仓
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          NEED_SEED=0
          if ERR=$(gh api "repos/$REPO/commits?per_page=1" 2>&1); then
            echo "分发仓已有提交，跳过"
          else
            case "$ERR" in
              *mpty*)
                echo "分发仓一个提交都没有，先塞个 README 把默认分支建出来"
                NEED_SEED=1
                ;;
              *)
                # 权限不对、仓名写错之类，别伪装成"空仓"往下走
                echo "::error::查不到分发仓的提交记录：$ERR"
                exit 1
                ;;
            esac
          fi

          if [ "$NEED_SEED" = 0 ]; then
            exit 0
          fi

          cat > README.md <<'MD'
          # GMPluse 分发仓

          这里只放编译好的安装包，源码在私有仓，不在这里。

          | 平台 | 文件 | 怎么装 |
          | --- | --- | --- |
          | Android | `GMPluse-vX.Y.Z.apk` | 下载后直接安装 |
          | iOS | `GMPluse-vX.Y.Z-unsigned.ipa` | TrollStore / AltStore / Sideloadly 侧载自签 |

          > iOS 是未签名包，需要自行侧载。App 内「我的 → 检查更新」读的是本仓
          > `releases/latest/download/latest.json`，所以 release 不能勾 draft / prerelease。
          MD

          if ! gh api "repos/$REPO/contents/README.md" -X PUT \
               -f message="初始化分发仓" \
               -f content="$(base64 -w0 README.md)" > /dev/null; then
            echo "::error::自动初始化失败。请手动打开 https://github.com/$REPO 点「Add a README file」建一个文件，再重跑本 job。"
            exit 1
          fi
          echo "已初始化"

      - name: 推到公开分发仓
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          echo "Release 说明用 body.md（上一步按 CHANGELOG.md 生成的）"

          # 已存在就复用（同一版本重复推时不报错），顺手把说明覆盖成最新的 ——
          # 更新日志改了个错字重跑一次，Release 页面也跟着更新
          if gh release view "v$V" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "v$V" --repo "$REPO" \
              --title "GMPluse v$V" \
              --notes-file body.md
          else
            gh release create "v$V" --repo "$REPO" \
              --title "GMPluse v$V" \
              --notes-file body.md
          fi

          # nullglob：通配符没匹配到就展开成空，否则会把字面量当文件名传给 gh
          shopt -s nullglob
          FILES=(dist/*.apk dist/*.ipa dist/latest.json)
          gh release upload "v$V" --repo "$REPO" --clobber "${FILES[@]}"
