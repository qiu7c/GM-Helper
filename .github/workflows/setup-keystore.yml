name: 一次性生成签名密钥

# 只需要跑一次：生成固定的 release 签名密钥，并提交进仓库。
# 之后 build.yml 每次都用它签名，APK 就能一直覆盖安装了。
#
# 跑法：Actions → 左侧「一次性生成签名密钥」→ Run workflow
on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 需要提交密钥文件
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 生成密钥（已存在就跳过）
        run: |
          KS=.github/keystore/gmpluse.jks
          # 这个判断很重要：密钥一旦生成就不能再换 —— 换了的话所有已经
          # 装好的 App 都会因为签名不一致而无法覆盖安装，用户得卸载重装。
          if [ -f "$KS" ]; then
            echo "::notice::$KS 已存在，跳过生成（重新生成会让已安装的 App 无法覆盖安装）"
            exit 0
          fi
          mkdir -p .github/keystore
          keytool -genkeypair -v \
            -keystore "$KS" \
            -alias gmpluse \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass gmpluse2026 -keypass gmpluse2026 \
            -dname "CN=GMPluse, OU=GMPluse, O=GMPluse, L=Guangzhou, ST=Guangdong, C=CN"
          echo "--- 签名指纹（以后每次构建都会打印同一个，可以拿来对）---"
          keytool -list -v -keystore "$KS" -storepass gmpluse2026 \
            | grep -E 'SHA256|SHA1|Alias'

      - name: 提交进仓库
        run: |
          if git diff --quiet && git ls-files --error-unmatch .github/keystore/gmpluse.jks >/dev/null 2>&1; then
            echo "没有变化，不用提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keystore/gmpluse.jks
          git commit \
            -m "chore: 加入固定的 release 签名密钥" \
            -m "在此之前每次构建用的都是随机生成的调试密钥，所以每个 APK 签名都不同，Android 判定为「包名冲突」拒绝覆盖安装。换成固定密钥后就能一直覆盖安装。"
          git push
